# Deep Shaft deploys as a plain static site: build once, publish `dist/`.
[build]
  command = "npm run build"
  publish = "dist"

# Hashed bundle filenames are safe to cache forever; the shell must revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
