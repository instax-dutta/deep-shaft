# Deep Shaft app shell.
#
# Hashed asset filenames may be cached forever; the shell documents and the service worker
# must revalidate so a new build actually reaches players. The single-page fallback keeps a
# deep-linked or mistyped path inside the game instead of a 404.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location /art/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
}
