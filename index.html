<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12100e" />
    <meta
      name="description"
      content="Deep Shaft is a free browser idle game: buy drills, hire a crew, and dig through five tiers of ore, gems, and rare minerals. Plays offline."
    />
    <!-- Social cards read absolute URLs; the game itself ships relative paths so it installs
         from any deployment path, so the production domain is stated once, here. -->
    <title>Deep Shaft — manage a mine that digs itself</title>
    <meta property="og:title" content="Deep Shaft" />
    <meta
      property="og:description"
      content="An idle mine management game: buy drills, hire a crew, and dig through five tiers of ore, gems, and rare minerals - the mine works while you are away."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deepshaft.sdad.pro/" />
    <meta property="og:image" content="https://deepshaft.sdad.pro/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Deep Shaft" />
    <meta
      name="twitter:description"
      content="An idle mine management game: buy drills, hire a crew, and dig through five tiers of ore, gems, and rare minerals - the mine works while you are away."
    />
    <meta name="twitter:image" content="https://deepshaft.sdad.pro/og-image.png" />
    <link rel="canonical" href="https://deepshaft.sdad.pro/" />
    <!-- Relative links so the static build is installable from any deployment path. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
